name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Runs on main are never cancelled,
# so a release image is not abandoned half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: Vet and test (with the race detector)
        run: make test
      - name: Coverage gate (at least 80%)
        run: make cover

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check, tests and coverage gate (at least 80%)
        run: npm run cover
      - name: Production build
        run: npm run build

  image:
    name: Image
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to GHCR, which only happens for main
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, got '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build the image (for this machine)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sweep-tracker:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (Postgres and MQTT in Docker, a position through the whole path)
        run: scripts/smoke-image.sh sweep-tracker:ci "${{ steps.version.outputs.version }}"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest and sha-<commit> always move. The version tag is only written the first time, so a
      # published version is never silently replaced: bump VERSION to publish a new one.
      - name: Work out the tags
        id: tags
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tags="$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION is already published, so it was not replaced. Bump VERSION to publish a new version tag."
            echo "version_tag=skipped (already published)" >> "$GITHUB_OUTPUT"
          else
            tags="$tags,$IMAGE:$VERSION"
            echo "version_tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR (amd64 and arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: |
          {
            echo "### Published to GHCR"
            echo
            echo "Version tag: \`$VERSION_TAG\`"
            echo
            echo "$TAGS" | tr ',' '\n' | while read -r tag; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
