# Example: sweep-tracker + Postgres. Point SWEEP_MQTT_BROKER at the broker your
# Meshcore→MQTT bridge publishes to (add that container here if you run it locally).
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: sweep, POSTGRES_DB: sweep }
    volumes: [pgdata:/var/lib/postgresql/data]
  sweep:
    build: { context: ., args: { VERSION: "0.1.0" } }
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      SWEEP_DATABASE_URL: postgres://postgres:sweep@db:5432/sweep?sslmode=disable
      SWEEP_MQTT_BROKER: tcp://mqtt:1883
      SWEEP_MQTT_TOPIC: meshcore/sweep/#
    volumes: [sweepdata:/data]
volumes: { pgdata: {}, sweepdata: {} }
